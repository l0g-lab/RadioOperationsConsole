name: CI

# Runs the test suite (frontend + backend) on every pull request and every
# push to main — independent of releases, which only happen on a version tag
# (see release.yml). This is what gives day-to-day merges fast feedback, so
# problems surface long before anyone gets around to cutting a release.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # GitHub shows a called workflow's checks as "<this job> / <its job>", so
  # both are named: "Test suite / Build, test and lint (Linux)".
  test:
    name: Test suite
    uses: ./.github/workflows/reusable-test.yml
