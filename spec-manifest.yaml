specification:
  title: Radio Operations Console
  version: 0.1.0-foundation
  status: draft
  normative_language: RFC_2119_style
  paths_relative_to: repository_root

product_constraints:
  platforms:
    - windows
    - linux
  offline_first: true
  initial_collaboration_mode: single_workstation
  activity_focus: one_focused_multiple_open
  initial_aprs_mode: receive_only
  team_chat_integrations: prohibited
  agent_vendor_specific_instructions: prohibited

reading_order:
  - docs/README.md
  - docs/00-product-vision.md
  - docs/01-product-principles.md
  - docs/02-scope-and-release-boundaries.md
  - docs/03-personas-and-operating-context.md
  - docs/04-domain-language.md
  - docs/05-event-and-template-model.md
  - docs/06-application-shell-and-navigation.md
  - docs/07-time-audit-and-record-history.md
  - docs/decisions/ADR-001-desktop-platform.md
  - docs/decisions/ADR-002-offline-first-storage.md
  - docs/features/weekly-net-operations.md
  - docs/features/qrz-callsign-enrichment.md
  - docs/features/checkin-location-map.md
  - docs/features/nws-alerts.md
  - docs/features/weather-radar-display.md
  - docs/features/skywarn-incidents-and-reports.md
  - docs/features/aprs-is-live-feed.md
  - docs/features/location-resolution.md
  - docs/features/mile-marker-lookup.md
  - docs/features/offline-callsign-directory.md
  - docs/features/database-backup-restore.md
  - docs/features/display-preferences.md
  - docs/features/local-storage.md
  - docs/features/activity-lifecycle-and-wrap-up.md
  - docs/features/ics-form-exports.md
  - docs/features/activity-exports.md
  - docs/features/station-log.md
  - docs/features/range-check.md
  - docs/features/repeater-directory.md
  - docs/features/net-listings.md
  - docs/features/saved-places.md
  - docs/agent/BUILD_PROTOCOL.md

# Every normative requirement ID uses one of these prefixes. When drafting a
# new document, pick a prefix not already listed here and add it below in
# the same change, so IDs never collide across documents.
id_prefixes:
  VISION: docs/00-product-vision.md
  PRINCIPLE: docs/01-product-principles.md
  SCOPE: docs/02-scope-and-release-boundaries.md
  SCOPE-NG: docs/02-scope-and-release-boundaries.md
  PERSONA: docs/03-personas-and-operating-context.md
  DOMAIN: docs/04-domain-language.md
  EVENT: docs/05-event-and-template-model.md
  TEMPLATE: docs/05-event-and-template-model.md
  UX: docs/06-application-shell-and-navigation.md
  UX-CI: docs/06-application-shell-and-navigation.md
  UX-MAP: docs/06-application-shell-and-navigation.md
  UX-OPS: docs/06-application-shell-and-navigation.md
  TIME: docs/07-time-audit-and-record-history.md
  AUDIT: docs/07-time-audit-and-record-history.md
  STORAGE: docs/decisions/ADR-002-offline-first-storage.md
  NETOPS: docs/features/weekly-net-operations.md
  QRZ: docs/features/qrz-callsign-enrichment.md
  CIMAP: docs/features/checkin-location-map.md
  NWSA: docs/features/nws-alerts.md
  RADAR: docs/features/weather-radar-display.md
  SPOT: docs/features/skywarn-incidents-and-reports.md
  APRSIS: docs/features/aprs-is-live-feed.md
  LOCRES: docs/features/location-resolution.md
  MILE: docs/features/mile-marker-lookup.md
  CALLDIR: docs/features/offline-callsign-directory.md
  # ACTTPL: retired; activity templates were removed (do not reuse).
  BACKUP: docs/features/database-backup-restore.md
  PREF: docs/features/display-preferences.md
  STORE: docs/features/local-storage.md
  LIFE: docs/features/activity-lifecycle-and-wrap-up.md
  ICSF: docs/features/ics-form-exports.md
  EXPORT: docs/features/activity-exports.md
  RANGE: docs/features/range-check.md
  RPT: docs/features/repeater-directory.md
  NETL: docs/features/net-listings.md
  LOG: docs/features/station-log.md
  PLACE: docs/features/saved-places.md

