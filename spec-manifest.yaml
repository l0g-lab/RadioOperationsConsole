# Feature-specific procedure and interaction detail (as opposed to the
# cross-activity model in docs/05 and docs/06) lives under docs/features/,
# one file per feature, named <slug>.md matching the slug below. A feature
# moves from `planned_feature_specs` into `documents` (with an id, path, and
# depends_on) as soon as it has a drafted spec, per BUILD_PROTOCOL.
planned_feature_specs:
  # map-geocoding-and-radar has been superseded: geocoding infrastructure
  # is covered by checkin-location-map.md, radar display by
  # weather-radar-display.md, and the remaining report/incident
  # location-picker (UX-MAP-001-005) is covered by
  # skywarn-incidents-and-reports.md, now drafted (Spotter Reports only;
  # Incidents remains a future increment within that same document).
  - set-exercise-control
  - ares-races-activation
  # reports-ics-and-winlink is partially built: check-in roster export as
  # CSV/JSON/Winlink ICS-213 form data exists (weekly-net-operations.md,
  # NETOPS-046-048, src/export.ts). This slug remains planned for the
  # part not yet covered. Spotter reports now export as CSV, JSON, and a
  # text report (skywarn-incidents-and-reports.md, SPOT-050-054); still
  # planned are incidents exports, any ICS form beyond ICS-213 and ICS-309
  # (ics-form-exports.md: 309 for check-ins and 213 for spotter reports, both
  # as Winlink import data and printable), and agency-specific report formats.
  - reports-ics-and-winlink
