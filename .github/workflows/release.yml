name: Release

# Builds installers for Linux, Windows, and macOS and publishes them to the
# GitHub Releases page.
#
# Trigger: push a tag like "v1.4.0" after `npm run version:set -- 1.4.0` and
# giving the release its section in CHANGELOG.md (see CONTRIBUTING.md). The
# release is created as a draft, with that section as its description, to be
# published by hand. "Run workflow" from the Actions tab also works, for a dry
# run without creating a tag.
#
# The test job (shared with ci.yml — see reusable-test.yml) gates the
# release: nothing is published unless the full test suite passes first.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Ubuntu system libraries Tauri needs to compile the webview shell. Also
# duplicated in reusable-test.yml, which (being a separate reusable workflow)
# can't share this block — see README.md's "Get it running" section for the
# same list documented for a local dev setup.
env:
  LINUX_APT_PACKAGES: >-
    build-essential
    libssl-dev
    libxdo-dev
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (not "ubuntu-latest") so the build links against an older
          # glibc — the .deb/.rpm/.AppImage stay installable on older
          # distributions too, not just whatever the runner happens to ship.
          - platform: ubuntu-22.04
          - platform: windows-latest
          # Universal binary (Apple Silicon + Intel) in one bundle, same as
          # a user downloading one .dmg regardless of which Mac they have.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT_PACKAGES }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # A tag that doesn't match the version in the files would publish a
      # release whose installers say a different version.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: node scripts/version.mjs check --tag "${{ github.ref_name }}"

      # The release description is this version's section of CHANGELOG.md
      # (the Unreleased section for a dry run from the Actions tab).
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="Unreleased"; fi
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/version.mjs notes "$version"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Radio Operations Console ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ## Download

            See the assets below for your platform:

            - **Linux:** `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), or `.AppImage` (runs on most distributions)
            - **Windows:** `.msi` or the `.exe` (NSIS) installer
            - **macOS:** `.dmg` (one universal build, works on Apple Silicon and Intel)

            Windows, Linux, and macOS builds come from the same source. Windows installers are not code-signed,
            so Windows may warn ("Unknown publisher" / SmartScreen) before you can run one; macOS is not
            notarized, so it may warn that the developer can't be verified (right-click the app and choose
            Open to run it anyway). Neither is a sign of tampering, just the cost of an unsigned open-source
            build.
          releaseDraft: true
          prerelease: false
