name: Feature idea
description: Something that would make the app more useful on the air
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The situation you're in — a weekly net, an activation, a range check — and what's hard about it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
